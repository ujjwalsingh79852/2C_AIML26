<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Student {
  
  static totalStudents = 0;

  constructor(rollNo, name, marks) {
    this.rollNo = rollNo;
    this.name = name;
    this.marks = marks;
    Student.totalStudents++;
  }

  
  displayResult() {
    const status = this.marks >= 40 ? "Passed" : "Failed";
    console.log(`Roll No: ${this.rollNo}`);
    console.log(`Name: ${this.name}`);
    console.log(`Marks: ${this.marks}`);
    console.log(`Result: ${status}`);
    console.log("-----------------------------");
  }

 
  static displayTotalStudents() {
    console.log(`Total Students Created: ${Student.totalStudents}`);
  }
}


const student1 = new Student(101, "Aarav Sharma", 85);
const student2 = new Student(102, "Priya Verma", 32);
const student3 = new Student(103, "Rohan Gupta", 47);


student1.displayResult();
student2.displayResult();
student3.displayResult();


Student.displayTotalStudents();
    </script>
</body>
</html>
