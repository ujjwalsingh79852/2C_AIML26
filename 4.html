
<html>
    <head>
        <script>
            function response(){
                let a = parseInt(prompt("Enter value of a: "));
                if(a>=18){
                    let c = confirm("do you want to submit your age");
                    if(c){
                        alert("Your response submitted successfully");
                    }
                    else{
                        alert("Your response not submitted");
                    }
                }
               
                
            }
        </script>
    </head>
    <body>
        <input type="button" onclick="response()" value="result" >
    </body>
</html>
