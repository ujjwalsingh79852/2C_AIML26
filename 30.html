<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Product {
    
    constructor(productId, productName, price) {
        this.productId = productId;
        this.productName = productName;
        this.price = price;
    }

    
    getDiscountedPrice(discount) {
        return this.price - (this.price * discount / 100);
    }

   
    display() {
        
        console.log("ID:", this.productId);
        console.log("Name:", this.productName);
        console.log("Price:", this.price);
    }

    
    static compareProducts(p1, p2) {
        if (p1.price > p2.price)
            console.log("Higher Price:", p1.productName);
        else
            console.log("Higher Price:", p2.productName);
    }
}



class Electronics extends Product {

    constructor(productId, productName, price, warranty) {
        super(productId, productName, price);

        this.warranty = warranty;
    }

    
    display() {
        super.display();
        console.log("Warranty:", this.warranty, "years");
    }
}



let p1 = new Product(101, "Laptop Bag", 2000);
let p2 = new Product(102, "Keyboard", 3000);

let e1 = new Electronics(103, "Laptop", 50000, 2);



console.log("Discounted Price:", p1.getDiscountedPrice(10));


Product.compareProducts(p1, p2);


e1.display();
    </script>
</body>
</html>
