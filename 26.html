<body>
    <script>
        class student{
            constructor(name){
                this.name = name;
            }
            info(){
                console.log("student info");
                console.log(this.name);
            }
            static display(){
                console.log("static method");
            }
        }
        const s1 = new student("ujjwal");
        s1.info();
        student.display();
    </script>
    
</body>
